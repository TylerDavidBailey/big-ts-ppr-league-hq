name: Refresh player index

# Sleeper asks that /players/nfl be fetched at most once a day, and the file is
# only names, positions, and teams. Weekly is plenty, with a manual trigger for
# the odd rookie who matters sooner.
on:
  schedule:
    - cron: '17 9 * * 2' # Tuesdays, after the NFL week settles
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Regenerate players.min.json
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Regenerate the index
        run: node scripts/build-player-index.mjs

      - name: Open a pull request if anything changed
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/refresh-player-index
          commit-message: 'chore(data): refresh the NFL player index'
          title: 'chore(data): refresh the NFL player index'
          body: |
            Automated refresh of `public/data/players.min.json` from
            `https://api.sleeper.app/v1/players/nfl`.

            Generated by `scripts/build-player-index.mjs`. Merge when CI is green.
          labels: automated, data
          delete-branch: true
          add-paths: public/data/players.min.json
